name: Build python executable

on:
  workflow_dispatch:
    inputs:
      windows-version:
        description: 'Windows version to build for'
        required: true
        type: string
        default: '2025'
      mac-version:
        description: 'Mac version to build for'
        required: true
        type: string
        default: 'latest'
      linux-version:
        description: 'Linux version to build for'
        required: true
        type: string
        default: 'latest'
      python-version:
        description: 'Python version to build with'
        required: true
        type: string
        default: '3.13'
      windows-build-script:
        description: 'Windows build script to use'
        required: true
        type: string
        default: 'build.py'
      mac-build-script:
        description: 'Mac build script to use'
        required: true
        type: string
        default: 'build.py'
      linux-build-script:
        description: 'Linux build script to use'
        required: true
        type: string
        default: 'build.py'

jobs:
  multiplatform-build:
    strategy:
        fail-fast: false
        matrix:
          platform-name: [linux, windows, mac]
          include:
            - platform-name: linux
              operating-system: ubuntu-${{inputs.linux-version}}
            - platform-name: windows
              operating-system: windows-${{inputs.windows-version}}
            - platform-name: mac
              operating-system: macos-${{inputs.mac-version}}
    
    runs-on: ${{matrix.operating-system}}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{github.ref_name}}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{inputs.python-version}}

      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - if: matrix.platform-name == 'windows'
        run: python ${{inputs.windows-build-script}}
      - if: matrix.platform-name == 'mac'
        run: python ${{inputs.mac-build-script}}
      - if: matrix.platform-name == 'linux'
        run: python ${{inputs.linux-build-script}}

      - uses: actions/upload-artifact@v4
        with:
          name: game-build-${{matrix.platform-name}}
          path: dist/${{matrix.platform-name}}/